name: Deploy Templatized Data Environment

on:
  pull_request:
    types: [closed]
    branches:
      - staging
      - main
  push:
    branches:
      - staging
      - main

permissions:
  contents: read

jobs:
  deploy_data_environment:
    # Only run when PR is merged or on direct push to environment branches
    if: github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.pull_request.merged == true)
    runs-on: ubuntu-latest

    env:
      # Named connection: advanced_data_engineering_snowflake (see config.toml)
      SNOWFLAKE_CONNECTIONS_ADVANCED_DATA_ENGINEERING_SNOWFLAKE_ACCOUNT: ${{ secrets.SNOWFLAKE_ACCOUNT }}
      SNOWFLAKE_CONNECTIONS_ADVANCED_DATA_ENGINEERING_SNOWFLAKE_USER: ${{ secrets.SNOWFLAKE_USER }}
      SNOWFLAKE_CONNECTIONS_ADVANCED_DATA_ENGINEERING_SNOWFLAKE_AUTHENTICATOR: SNOWFLAKE_JWT
      SNOWFLAKE_CONNECTIONS_ADVANCED_DATA_ENGINEERING_SNOWFLAKE_WAREHOUSE: ${{ secrets.SNOWFLAKE_WAREHOUSE }}
      SNOWFLAKE_CONNECTIONS_ADVANCED_DATA_ENGINEERING_SNOWFLAKE_ROLE: ${{ secrets.SNOWFLAKE_ROLE }}
      SNOWFLAKE_CONNECTIONS_ADVANCED_DATA_ENGINEERING_SNOWFLAKE_DATABASE: COURSE_REPO
      SNOWFLAKE_CONNECTIONS_ADVANCED_DATA_ENGINEERING_SNOWFLAKE_SCHEMA: PUBLIC

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set deployment target
        id: set_env
        run: |
          TARGET_BRANCH="${GITHUB_BASE_REF:-${GITHUB_REF#refs/heads/}}"

          if [[ "$TARGET_BRANCH" == "staging" ]]; then
            echo "SNOWFLAKE_ENV=STAGING" >> "$GITHUB_ENV"
            echo "DEPLOY_BRANCH=staging" >> "$GITHUB_ENV"
            echo "Environment set to staging"
          elif [[ "$TARGET_BRANCH" == "main" ]]; then
            echo "SNOWFLAKE_ENV=PROD" >> "$GITHUB_ENV"
            echo "DEPLOY_BRANCH=main" >> "$GITHUB_ENV"
            echo "Environment set to production"
          else
            echo "Unexpected branch: $TARGET_BRANCH"
            exit 1
          fi

      - name: Install Snowflake CLI
        uses: snowflakedb/snowflake-cli-action@v1.5
        with:
          cli-version: "latest"
          default-config-file-path: "config.toml"

      - name: Configure Snowflake private key
        env:
          SNOWFLAKE_PRIVATE_KEY_B64: ${{ secrets.SNOWFLAKE_PRIVATE_KEY_B64 }}
          SNOWFLAKE_PRIVATE_KEY_PASSPHRASE: ${{ secrets.SNOWFLAKE_PRIVATE_KEY_PASSPHRASE }}
        run: |
          KEY_PATH="${RUNNER_TEMP}/snowflake_rsa_key.p8"
          KEY_B64="$(printf '%s' "$SNOWFLAKE_PRIVATE_KEY_B64" | tr -d '[:space:]')"

          if [[ -z "$KEY_B64" ]]; then
            echo "Missing secret SNOWFLAKE_PRIVATE_KEY_B64."
            echo "Create it with: base64 -i ~/.snowflake/keys/rsa_key.p8 | tr -d '\\n' | pbcopy"
            exit 1
          fi

          printf '%s' "$KEY_B64" | base64 -d > "$KEY_PATH"
          chmod 600 "$KEY_PATH"

          if ! openssl pkey -in "$KEY_PATH" -noout >/dev/null 2>&1; then
            echo "Invalid PEM after base64 decode (MalformedFraming)."
            echo "Re-create SNOWFLAKE_PRIVATE_KEY_B64 from your rsa_key.p8 file."
            exit 1
          fi

          KEY_FP="$(openssl pkey -in "$KEY_PATH" -pubout -outform DER | openssl dgst -sha256 -binary | openssl enc -base64)"
          echo "Decoded key fingerprint: SHA256:${KEY_FP}="
          echo "Snowflake user fingerprint should match DESCRIBE USER <user> -> RSA_PUBLIC_KEY_FP"

          if [[ -n "$SNOWFLAKE_PRIVATE_KEY_PASSPHRASE" ]]; then
            echo "PRIVATE_KEY_PASSPHRASE is set (encrypted key)."
            echo "PRIVATE_KEY_PASSPHRASE=$SNOWFLAKE_PRIVATE_KEY_PASSPHRASE" >> "$GITHUB_ENV"
          fi

          echo "SNOWFLAKE_CONNECTIONS_ADVANCED_DATA_ENGINEERING_SNOWFLAKE_PRIVATE_KEY_FILE=$KEY_PATH" >> "$GITHUB_ENV"

      - name: Verify Snowflake connection
        run: |
          echo "Using account: ${SNOWFLAKE_CONNECTIONS_ADVANCED_DATA_ENGINEERING_SNOWFLAKE_ACCOUNT}"
          echo "Using user: ${SNOWFLAKE_CONNECTIONS_ADVANCED_DATA_ENGINEERING_SNOWFLAKE_USER}"
          echo "Account must be UTHZAZW-FJ87774 (not the FD17944 locator alone)."
          snow connection test

      - name: Fetch latest changes to Snowflake
        run: snow git fetch COURSE_REPO.PUBLIC.ADVANCED_DATA_ENGINEERING_SNOWFLAKE

      - name: Deploy data pipeline
        run: |
          echo "Deploying branch: ${DEPLOY_BRANCH} with env: ${SNOWFLAKE_ENV}"
          snow git execute "@advanced_data_engineering_snowflake/branches/${DEPLOY_BRANCH}/module-1/hamburg_weather/pipeline/data/" \
            -D "env='${SNOWFLAKE_ENV}'" \
            --database=COURSE_REPO \
            --schema=PUBLIC

      - name: Deploy pipeline objects
        run: |
          snow git execute "@advanced_data_engineering_snowflake/branches/${DEPLOY_BRANCH}/module-1/hamburg_weather/pipeline/objects/" \
            -D "env='${SNOWFLAKE_ENV}'" \
            --database=COURSE_REPO \
            --schema=PUBLIC
